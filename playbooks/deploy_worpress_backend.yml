---
- name: Playbook para instalar la pila LAMP en el Backend
  hosts: backend
  become: yes

  vars_files:
    - ../vars/variables.yml

  tasks:  
    
    - name: Eliminar la base de datos
      mysql_db:
        name: "{{ db.name }}"
        state: absent
        login_unix_socket: /var/run/mysqld/mysqld.sock

    - name: Crear una base de datos
      mysql_db:
        name: "{{ db.name }}"
        state: present
        login_unix_socket: /var/run/mysqld/mysqld.sock 
    
  
    - name: Crear el usuario de la base de datos
      community.mysql.mysql_user:
        name: "{{ db.user }}"
        plugin: caching_sha2_password
        plugin_auth_string: "{{ db.password }}"
        salt: "0123456789abcdefghij"
        priv: "{{ db.name }}.*:ALL"
        host: "{{ ip.frontend_private_ip }}"
        state: present
        login_unix_socket: /var/run/mysqld/mysqld.sock


    - name: Reiniciamos el servicio de base de datos
      service:
        name: mysql
        state: restarted